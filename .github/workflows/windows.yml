name: Windows isolated MSI upgrade

on:
  push:
    branches:
      - codex/ci-rhythm-upgrade-4.13.7

permissions:
  contents: read
  actions: read

jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows 4.12+6
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46113462786
          name: GaoJieZou-Windows-x64
          path: old
      - name: Download Windows 4.13+7
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46115026121
          name: GaoJieZou-Windows-x64
          path: candidate
      - name: Upgrade in the same directory with synthetic data
        run: .\windows\verify-upgrade-ci.ps1
