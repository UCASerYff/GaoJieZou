name: Windows isolated MSI upgrade
on: push
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46113462786
          name: GaoJieZou-Windows-x64
          path: candidate
      - name: Upgrade from the published MSI with synthetic data
        run: .\windows\verify-upgrade-ci.ps1
