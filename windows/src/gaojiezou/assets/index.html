<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="gao-token" content="{{TOKEN}}">
  <title>搞节奏</title>
  <link rel="icon" href="/GaoJieZou.ico" type="image/x-icon">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/gao-world.css">
  <link rel="stylesheet" href="/health-ui.css">
  <link rel="stylesheet" href="/footprints-ui.css">
  <link rel="stylesheet" href="/review-ui.css">
  <script defer src="/app.js"></script>
  <script defer src="/gao-world.js"></script>
  <script defer src="/estate-world.js"></script>
  <script defer src="/island-world.js"></script>
  <script defer src="/train-world.js"></script>
  <script defer src="/rhythm-ui.js"></script>
  <script defer src="/review-ui.js"></script>
  <script defer src="/health-ui.js"></script>
  <script defer src="/estate-ui.js"></script>
  <script defer src="/footprints-ui.js"></script>
</head>
<body>
  <a class="skip" href="#app">跳至内容</a>
  <div class="desktop-shell">
    <aside class="navigation-rail">
      <button class="brand plain" type="button" data-go="today"><img src="/GaoJieZouMark.png" width="34" height="34" alt=""><strong id="brand-title">搞节奏</strong></button>
      <nav id="workspaces" class="workspaces" aria-label="工作台"></nav>
      <div id="rail-actions" class="rail-actions"></div>
    </aside>
    <div class="workbench">
      <header class="chrome">
        <div class="topbar">
          <div id="workspace-context" class="workspace-context"></div>
          <div id="toolbar" class="toolbar"></div>
        </div>
        <div id="subbar" class="subbar" hidden></div>
      </header>
      <main id="app" tabindex="-1" aria-busy="true"><div class="workspace"><div class="status-panel" role="status"><span class="loading-ring" aria-hidden="true"></span><h1>正在打开搞节奏</h1></div></div></main>
    </div>
  </div>
  <p id="notice" class="toast" role="status" hidden></p>
  <dialog id="editor" aria-labelledby="editor-title">
    <form class="dialog-form">
      <div class="dialog-head"><h2 id="editor-title"></h2><button class="plain icon-only dialog-close" type="button" data-close aria-label="关闭">×</button></div>
      <div class="dialog-body"></div>
      <p class="dialog-error" role="alert" hidden></p>
      <div class="dialog-footer"></div>
    </form>
  </dialog>
</body>
</html>
